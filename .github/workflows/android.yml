name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Prepare web files
        run: |
          rm -rf www && mkdir -p www/audio
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png www/
          cp -r audio/. www/audio/ 2>/dev/null || true
      - run: npx cap add android
      - run: npx cap sync android
      - name: Lock portrait
        run: sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arabic-letter-island-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
